            <tr><td>Y</td><td>F</td><td>N</td><td>U</td><td>A</td><td>A</td><td>L</td><td>M</td><td>H</td></tr>

        <div class="word-row">
            <input type="text" id="userWord" placeholder="Type word here">
            <button onclick="checkWordCarBrands()" type="button">Submit</button>
        </div>

        <p id="result"></p>
        <p id="progress"></p>

        <div class="leaderboard-box">
            <h3>Car Brands Leaderboard</h3>

        </div>

        <div class="actions">
            <a href="login.html" class="button">Back to Categories</a>
